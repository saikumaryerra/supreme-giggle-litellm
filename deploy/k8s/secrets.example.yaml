# EXAMPLE ONLY — real secrets come from sealed-secrets or external-secrets
# operator (§8.3), never from ConfigMaps or committed manifests.
apiVersion: v1
kind: Secret
metadata:
  name: litellm-secrets
type: Opaque
stringData:
  LITELLM_MASTER_KEY: "sk-REPLACE"                       # rotate quarterly (§12)
  DATABASE_URL: "postgresql://litellm:PASS@litellm-db:5432/litellm"
  LITELLM_EXT_AUDIT_DB_URL: "postgresql+asyncpg://audit_app:PASS@audit-db:5432/audit"
  REDIS_HOST: "redis"
  REDIS_PASSWORD: ""
  LITELLM_EXT_SCIM_TOKEN: "REPLACE-LONG-RANDOM"
  # Provider keys referenced by keypool.yaml api_key_env — or F7 refs:
  OPENAI_API_KEY_A: "vault://kv/llm/openai-team-a#api_key"
  OPENAI_API_KEY_B: "vault://kv/llm/openai-team-b#api_key"
  ANTHROPIC_API_KEY_1: "awssm://prod/llm/anthropic#key1"
  ANTHROPIC_API_KEY_2: "awssm://prod/llm/anthropic#key2"
---
apiVersion: v1
kind: Secret
metadata:
  name: oauth2-proxy-secrets
type: Opaque
stringData:
  client-id: "litellm-ui"
  client-secret: "REPLACE"
  cookie-secret: "REPLACE-32-BYTES-BASE64"
