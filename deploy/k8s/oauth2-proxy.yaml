# §5.4: Admin UI SSO — oauth2-proxy in OIDC mode against the same IdP.
# /ui, /sso, /login route through this at the ingress; the master key stays
# server-side and never reaches the browser.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth2-proxy
  labels: {app: oauth2-proxy}
spec:
  replicas: 2
  selector:
    matchLabels: {app: oauth2-proxy}
  template:
    metadata:
      labels: {app: oauth2-proxy}
    spec:
      containers:
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.6.0
          args:
            - --provider=oidc
            - --oidc-issuer-url=$(OIDC_ISSUER_URL)
            - --upstream=http://litellm:4000
            - --http-address=0.0.0.0:4180
            - --email-domain=*
            - --allowed-group=llm-admin          # admins only (§5.4)
            - --oidc-groups-claim=roles
            - --skip-provider-button=true
            - --set-xauthrequest=true
          env:
            - name: OIDC_ISSUER_URL
              valueFrom:
                configMapKeyRef: {name: litellm-ext-env, key: LITELLM_EXT_JWT_ISSUER}
            - name: OAUTH2_PROXY_CLIENT_ID
              valueFrom:
                secretKeyRef: {name: oauth2-proxy-secrets, key: client-id}
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef: {name: oauth2-proxy-secrets, key: client-secret}
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef: {name: oauth2-proxy-secrets, key: cookie-secret}
          ports: [{containerPort: 4180}]
          resources:
            requests: {cpu: 100m, memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: oauth2-proxy
spec:
  selector: {app: oauth2-proxy}
  ports: [{port: 4180, targetPort: 4180}]
