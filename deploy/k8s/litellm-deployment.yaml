# §8.3: LiteLLM proxy Deployment + Service, with the SCIM sidecar (F6).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
  labels: {app: litellm}
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels: {app: litellm}
  template:
    metadata:
      labels: {app: litellm}
    spec:
      serviceAccountName: litellm   # bound to Vault role / IRSA (F7)
      securityContext:
        runAsNonRoot: true
      containers:
        - name: litellm
          image: ghcr.io/YOUR_ORG/litellm-ext:latest   # pinned by CI on release
          ports: [{containerPort: 4000}]
          envFrom:
            - secretRef: {name: litellm-secrets}       # provider keys, master key, DB URLs
            - configMapRef: {name: litellm-ext-env}    # LITELLM_EXT_* non-secret settings
          volumeMounts:
            - {name: config, mountPath: /app/config/keypool.yaml, subPath: keypool.yaml}
            - {name: config, mountPath: /app/config/rbac.yaml, subPath: rbac.yaml}
            - {name: config, mountPath: /app/config/budgets.yaml, subPath: budgets.yaml}
          resources:
            requests: {cpu: "1", memory: 2Gi}
            limits: {memory: 4Gi}
          readinessProbe:
            httpGet: {path: /health/readiness, port: 4000}
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health/liveliness, port: 4000}
            initialDelaySeconds: 60
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
        - name: litellm-ext-scim                       # F6 sidecar (§7B.2)
          image: ghcr.io/YOUR_ORG/litellm-ext:latest
          command: ["python", "-m", "uvicorn", "litellm_ext.scim.app:create_app", "--factory", "--host", "0.0.0.0", "--port", "8090"]
          ports: [{containerPort: 8090}]
          envFrom:
            - secretRef: {name: litellm-secrets}
            - configMapRef: {name: litellm-ext-env}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
      volumes:
        - name: config
          configMap: {name: litellm-ext-config}
---
apiVersion: v1
kind: Service
metadata:
  name: litellm
spec:
  selector: {app: litellm}
  ports:
    - {name: proxy, port: 4000, targetPort: 4000}
    - {name: scim, port: 8090, targetPort: 8090}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: litellm
  # annotations:
  #   eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT:role/litellm-ext-irsa  # F7 AWS
