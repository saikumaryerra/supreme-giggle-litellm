# §9.2: triggered by Renovate's weekly LITELLM_VERSION bump PR.
# Runs the full contract + integration suite against the new base image and
# posts the result summary to the PR — the gate for any version bump.
name: upgrade

on:
  pull_request:
    types: [labeled, synchronize]

jobs:
  upgrade-gate:
    if: contains(github.event.pull_request.labels.*.name, 'litellm-upgrade')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify base image signature (cosign)
        run: |
          VERSION=$(grep -oP 'ARG LITELLM_VERSION=\K[\w.]+' docker/Dockerfile)
          echo "Bumped to litellm $VERSION"
          # cosign verify ghcr.io/berriai/litellm:$VERSION --key litellm-cosign.pub
          # (enable once the published key is vendored)

      - name: Sync pin and run contract suite against new version
        run: |
          python scripts/sync_litellm_pin.py
          pip install -e '.[test]'
          pytest tests/contract -m contract --tb=long

      - name: Full integration suite against new image
        run: |
          pip install build && python -m build --wheel
          docker compose -f tests/integration/docker-compose.test.yaml up -d --build
          pytest tests/integration -m integration --tb=short
          docker compose -f tests/integration/docker-compose.test.yaml down -v

      - name: Post result to PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const outcome = '${{ job.status }}';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Upgrade gate: **${outcome}** — contract + integration suite against the bumped LiteLLM image.`,
            });
