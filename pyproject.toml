[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "litellm-ext"
version = "0.1.0"
description = "Self-built enterprise layer for the LiteLLM proxy: SSO/JWT auth & RBAC, audit logging, guardrails & PII masking, multi-key provider pools, and extended enterprise features (F1-F13)."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Platform Team" }]
dependencies = [
    "PyJWT[crypto]>=2.8",
    "httpx>=0.27",
    "pydantic>=2",
    "pydantic-settings>=2",
    "SQLAlchemy>=2",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "tenacity>=8.2",
    "pyyaml>=6",
    "prometheus-client>=0.20",
    "fastapi>=0.111",
    "redis>=5",
]

[project.optional-dependencies]
# litellm[proxy] is provided by the base Docker image at runtime; it is declared
# only here so contract/integration tests run against the exact pinned version.
# CI substitutes this pin from the Dockerfile ARG LITELLM_VERSION (single source
# of truth) via scripts/sync_litellm_pin.py.
test = [
    "litellm[proxy]==1.92.0",
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "uvicorn>=0.30",
]
dev = [
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
]

[tool.hatch.build.targets.wheel]
packages = ["src/litellm_ext"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["litellm_ext"]
ignore_missing_imports = true
# litellm ships no type stubs; hook base classes are consumed dynamically.
disallow_subclassing_any = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "contract: interface assertions against the installed litellm version",
    "integration: docker-compose end-to-end tests",
]
